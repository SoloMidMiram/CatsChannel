name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.11"
      - run: uv sync --locked --all-extras
      - run: uv run --frozen pytest
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .
      - run: uv run --frozen python tools/project_context.py validate
      - run: uv run --frozen python tools/project_context.py generate --check
      - run: uv run --frozen python tools/regress.py run --profile context --repeat 2 --timeout 120

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cats_test
          POSTGRES_PASSWORD: disposable
          POSTGRES_DB: cats_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cats_test -d cats_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CATS_TEST_POSTGRES_URL: postgresql+asyncpg://cats_test:disposable@127.0.0.1:5432/cats_test
      CATS_TEST_POSTGRES_DISPOSABLE: "1"
      # Backup clients come from the existing PostgreSQL 16 service, not the runner's newer default.
      CATS_TEST_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          python-version: "3.11"
      - run: uv sync --locked --all-extras
      - run: uv run --frozen pytest tests/test_postgres_persistence.py tests/test_reply_chains.py tests/test_publication.py tests/test_publication_migrations.py tests/test_review_approval.py tests/test_telegram_hosted_reuse.py tests/test_backup_restore.py -q
