[project]
name = "cats-channel"
version = "0.1.0"
description = "Telegram cat video reply-chain bot"
requires-python = ">=3.11,<3.12"
dependencies = [
    "aiogram>=3.31,<4",
    "aiohttp-socks>=0.10,<1",
    "pydantic-settings>=2.0,<3",
    "yt-dlp[default,curl-cffi]>=2026.8.19",
]

[project.scripts]
cats-channel = "cats_channel.__main__:main"

[project.optional-dependencies]
userbot = ["telethon>=1.45,<2", "python-socks[asyncio]>=2.7,<3"]
pot = ["bgutil-ytdlp-pot-provider==2.0.2"]
persistence = [
    "sqlalchemy[asyncio]>=2.0.22,<3",
    "alembic>=1.13,<2",
    "asyncpg>=0.29,<1",
    "aiosqlite>=0.20,<1",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<1",
    "ruff>=0.12,<1",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cats_channel"]
