[project]
name = "cats-channel"
version = "0.1.0"
description = "Telegram cat video reply-chain bot"
requires-python = ">=3.13,<3.14"
dependencies = [
    "aiogram>=3.31,<4",
    "pydantic-settings>=2.0,<3",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13,<2",
    "asyncpg>=0.29,<1",
    "aiosqlite>=0.20,<1",
    "redis>=5,<6",
    "structlog>=24,<26",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<1",
    "ruff>=0.12,<1",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
